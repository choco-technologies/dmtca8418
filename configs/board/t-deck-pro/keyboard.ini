; LILYGO T-Deck Pro: the keyboard (TCA8418, a keypad scanner, at 0x34 on the I2C bus of the board; SDA = GPIO13, SCL = GPIO14, INT = GPIO15 - not
; used: the driver polls). 4 rows and 10 columns. The keys' light is GPIO42 (on or off, GPIO32..47 are port C of dmgpio: PC10).
;
; The bus is the one of the touch panel (touch.ini of dmcst66xx, the section touch_i2c: the controller 1 of dmi2c), so there is no bus here: the
; keyboard joins the friends_group of the e-paper (epd) and takes the node of the bus with the role "i2c" from it. In that group dmview finds the
; inputs of its display. dmgpio, dmi2c and dmcst66xx's touch.ini must be loaded (the keyboard is created after them: driver_order).
;
; The keys: a name for every place of the matrix, row by row (row0 .. row3), column by column - a letter, a digit, ENTER, BACKSPACE, SPACE,
; SHIFT, SHIFT_R, ALT, SYM, MIC, DOLLAR (the keys that a USB keyboard has none of get codes from 0x100 on, see dmtca8418.h), a code (0x2B), or -
; for a place without a key. libinput says what they give (a keymap: keymaps/t-deck-pro.ini of dminput).
;
; mirror_cols: the chip counts the columns from the right edge of the keyboard (as the vendor's firmware does).
; The last row is not checked on a keyboard yet - debug=yes logs every event of the chip (row, column, key) to find out the places.

[kbd_light]
driver_name=dmgpio
driver_order=2
friends_group=epd
friend_role=backlight
pin=PC10
mode=output
state=low

[keyboard]
driver_name=dmtca8418
driver_order=4
friends_group=epd
rows=4
cols=10
mirror_cols=yes
row0=Q W E R T Y U I O P
row1=A S D F G H J K L BACKSPACE
row2=ALT Z X C V B N M DOLLAR ENTER
row3=SHIFT MIC SPACE SPACE SPACE SPACE SPACE SYM SHIFT_R -
debug=no
